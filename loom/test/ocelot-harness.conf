schemaVersion = 2
project { id = "loomtest" }
workspace { kind = "manifest" }
runtime {
  tickRate = 20
  clock { autoStart = true }
  internet { http = false, tcp = false }
  limits {
    defaultMaxTicks = 20000
    defaultMaxWallTime = 120s
    eventBufferSize = 10000
  }
}
# Stock hardware: tier-3 computer, GPU and screen, 2 MiB.
devices {
  pc {
    kind = "computer", tier = 3
    inventory = [
      { slot = "gpu", kind = "gpu", tier = 3 },
      { slot = "memory-1", kind = "memory", tier = 3.5 },
      { slot = "memory-2", kind = "memory", tier = 3.5 },
      { slot = "disk-1", kind = "managed-hdd", tier = 3, id = "pc", label = "pc", source = "./pc", access = "read-write" },
      { slot = "cpu", kind = "cpu", tier = 3 },
      { slot = "eeprom", kind = "eeprom", builtin = "lua-bios" }
    ]
  }
  pc-screen { kind = "screen", tier = 3, keyboard = true }
}
connections = [
  { from = "pc:network", to = "pc-screen:network" }
]
